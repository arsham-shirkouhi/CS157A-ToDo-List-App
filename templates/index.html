<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/assets/css/styles.css" />
  <style>
    body {
      min-height: 100vh;
    }

    .page-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    main {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .hero {
      width: min(900px, 100%);
      margin-bottom: 0;
    }

    .button-row {
      justify-content: center;
    }

    .hero > div:first-child {
      text-align: left;
    }

    .hero > div:first-child .button-row {
      justify-content: flex-start;
    }

    .hero-points {
      list-style-position: inside;
      padding-left: 0;
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <main>
      <section class="hero">
        <div>
          <h1>Task Flow</h1>
          <p>
            Keep track of tasks, notes, and reminders.
          </p>

          <div class="button-row">
            <a class="ghost-button" href="/login">Log In</a>
            <a class="primary-button" href="/signup">Sign Up</a>
          </div>

          <ul class="hero-points">
            <li>Create and organize tasks by due date</li>
            <li>Save notes for classes, projects, and work</li>
            <li>Preview file uploads before any backend is built</li>
          </ul>
        </div>

        <div class="card">
          <p class="eyebrow">Preview</p>
          <h2>What the app does</h2>
          <p class="muted">You can create tasks, notes, and files.</p>
          <div id="homePreviewList" class="preview-list"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/assets/js/script.js"></script>
</body>

</html>
