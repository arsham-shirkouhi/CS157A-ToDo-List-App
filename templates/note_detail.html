<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow | {{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/assets/css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/home">
          <span class="brand-mark">TF</span>
          <span class="brand-copy">
            <strong>TaskFlow</strong>
            <small>Simple to-do and notes app</small>
          </span>
        </a>

        <nav class="nav-links">
          <a href="/home">Home</a>
          <a href="/dashboard">Dashboard</a>
          <a href="/tasks">Tasks</a>
          <a class="active" href="/notes">Notes</a>
          <a href="/files">Files</a>
          <a href="/profile">Profile</a>
        </nav>
      </header>

      <main>
        <section class="section-title">
          <div>
            <p class="eyebrow"><a href="/notes">Notes</a></p>
            <h1>Edit note</h1>
            <p class="muted">Saved {{ saved_at }}</p>
          </div>
        </section>

        <section class="card footer-space">
          {% if err %}
          <p class="text-danger">{{ err }}</p>
          {% endif %}
          <form method="post" class="form-grid">
            <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}" />
            <label>
              Title
              <input type="text" name="note_title" value="{{ title }}" required />
            </label>
            <label class="full-width">
              Contents
              <textarea name="contents" rows="14" placeholder="…">{{ contents }}</textarea>
            </label>
            <div class="full-width button-row">
              <button class="primary-button" type="submit">Save</button>
              <a class="ghost-button" href="/notes">Back</a>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
